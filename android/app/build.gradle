plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tkdtech.scoring'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.tkdtech.scoring'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.1.4-validation'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        def requestedAbis = (project.findProperty('abiFilters') ?: 'arm64-v8a,armeabi-v7a').toString().split(',').collect { it.trim() }
        ndk {
            abiFilters(*requestedAbis)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress 'zip'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs 'libnode/bin'
            assets.srcDirs 'src/main/assets', "${buildDir}/generated/tkdAssets"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
    }
}
